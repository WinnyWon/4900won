<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Webcam Body Filter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Helvetica,Arial,sans-serif}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:1;background:#111}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.status{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:10;padding:7px 10px;border:1px solid rgba(255,255,255,.38);background:rgba(0,0,0,.28);color:#fff;font-size:12px;font-weight:300;white-space:nowrap;backdrop-filter:blur(7px)}
.camera-intro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#fff;text-align:center;background:rgba(0,0,0,.12);opacity:1;visibility:visible;pointer-events:none;transition:opacity .5s ease,visibility .5s ease;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.camera-intro.is-hidden{opacity:0;visibility:hidden}
.camera-intro .intro-title{font-size:25px;font-weight:300;letter-spacing:-.02em}
.camera-intro .intro-subtitle{font-size:13px;font-weight:300;opacity:.72;text-transform:lowercase}
.hint{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);z-index:10;color:#fff;font-size:13px;font-weight:300;letter-spacing:.02em;text-align:center;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.ui{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;width:min(620px,calc(100vw - 40px));padding:0;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 30px rgba(0,0,0,.18);backdrop-filter:blur(12px)}
button{appearance:none;border:0;border-right:1px solid rgba(20,20,20,.18);border-radius:0;padding:15px 18px;background:rgba(245,242,239,.78);color:#111;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:400;letter-spacing:.01em;cursor:pointer;transition:background .18s ease,color .18s ease}
button:last-child{border-right:0}
button:hover{background:rgba(255,255,255,.96)}
button.active{background:#111;color:#fff}
@media(max-width:700px){
  .ui{width:calc(100vw - 24px);bottom:14px}
  button{padding:13px 8px;font-size:12px}
  .hint{bottom:79px;font-size:11px}
  .camera-intro .intro-title{font-size:20px}
}

/* =============================================
   APOD-inspired typography pass
   Font sizes intentionally preserved.
   ============================================= */
html, body, button, input, select, textarea {
  font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif;
  font-kerning: normal;
  font-synthesis: none;
  font-feature-settings: "kern" 1, "liga" 1;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body, a, button, span, p, h1, h2, h3, h4, h5, h6 {
  letter-spacing: -0.045em;
}

.status, .camera-intro .intro-title, .camera-intro .intro-subtitle, .hint, button {
  font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif;
}
.status { line-height: 1; letter-spacing: -0.025em; }
.camera-intro .intro-title { line-height: .95; letter-spacing: -0.045em; }
.camera-intro .intro-subtitle { line-height: 1; letter-spacing: -0.025em; }
.hint { line-height: 1; letter-spacing: -0.02em; }
button { line-height: 1; letter-spacing: -0.035em; }


/* Custom cursor */
@media (pointer:fine){
  html, body, a, button, [role="button"], .interactive, [data-lang], #info, #works, #shop { cursor:none !important; }
  .custom-cursor{
    position:fixed; left:0; top:0; width:42px; height:42px; z-index:99999;
    pointer-events:none; transform:translate(-50%,-50%); opacity:0;
    background:url("cursor2.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 3px rgba(127,127,127,.32));
    transition:opacity .12s ease;
  }
  .custom-cursor::before{
    content:""; position:absolute; left:50%; top:50%; width:78px; height:78px;
    transform:translate(-50%,-50%); border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(127,127,127,.18) 0%, rgba(127,127,127,.10) 34%, rgba(127,127,127,.045) 56%, rgba(127,127,127,0) 74%);
    filter:blur(5px);
  }
  body.cursor-ready .custom-cursor{opacity:1;}
}


.tryon-language{
  position:fixed;
  top:24px;
  right:28px;
  z-index:100;
  font-family:Arial,Helvetica,"Apple SD Gothic Neo",sans-serif;
  font-size:20px;
  line-height:1;
  letter-spacing:-.04em;
  color:#aaa;
}
.tryon-language [data-lang]{cursor:pointer}
.tryon-language .active{color:#fff}

   MOBILE ACCESS BLOCK

  display:none;

  #mobile-block{
    position:fixed;

    display:flex !important;

    justify-content:center;

  .mobile-block-text{

</head>
<body class="tryon-page">

<div id="mobile-block">
  <div class="mobile-block-text">
    DESKTOP ONLY<br>
    PLEASE VIEW ON A DESKTOP DEVICE.
  </div>
</div>

<div class="tryon-language"><span data-lang="ko">KR</span>/<span data-lang="en" class="active">EN</span></div>
<div id="app">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="camera-intro" id="cameraIntro" aria-hidden="true">
    <div class="intro-title" data-i18n="introTitle">sangsoo1ee signature TRY-ON</div>
    <div class="intro-subtitle" data-i18n="pcOnly">pc only</div>
  </div>
  <div class="status" id="status" data-i18n="cameraLoading">Camera loading...</div>
  <div class="hint" data-i18n="signatureDesign">signature design</div>
  <div class="ui">
    <button class="active" data-mode="forearm" data-i18n="forearm">FOREARM</button>
    <button data-mode="waist" data-i18n="waist">WAIST</button>
    <button data-mode="chest" data-i18n="chest">CHEST</button>
    <button data-mode="off" data-i18n="off">OFF</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const buttons=document.querySelectorAll('button');
const translations={
  en:{introTitle:'sangsoo1ee signature TRY-ON',pcOnly:'pc only',cameraLoading:'Camera loading...',signatureDesign:'signature design',forearm:'FOREARM',waist:'WAIST',chest:'CHEST',off:'OFF'},
  ko:{introTitle:'sangsoo1ee 시그니처 TRY-ON',pcOnly:'PC 전용',cameraLoading:'카메라 불러오는 중...',signatureDesign:'시그니처 도안',forearm:'전완',waist:'허리',chest:'가슴',off:'끄기'}
};
const languageButtons=[...document.querySelectorAll('.tryon-language [data-lang]')];
function applyLanguage(lang){
  const selected=translations[lang]?lang:'en';
  document.documentElement.lang=selected;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=translations[selected][el.dataset.i18n];
    if(v) el.textContent=v;
  });
  languageButtons.forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===selected));
  localStorage.setItem('sangsoo1ee-language',selected);
}
languageButtons.forEach(btn=>btn.addEventListener('click',()=>applyLanguage(btn.dataset.lang)));
applyLanguage(localStorage.getItem('sangsoo1ee-language')||'en');

let mode='forearm';
let lastPose=null;
let smoothPose=null;
let camera=null;
const graphic=new Image();
graphic.src='./maingraphic.svg';

buttons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode=btn.dataset.mode;
  });
});

function resize(){
  canvas.width=window.innerWidth*devicePixelRatio;
  canvas.height=window.innerHeight*devicePixelRatio;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize',resize);resize();

function lerp(a,b,t){return a+(b-a)*t}
function smoothLandmarks(next){
  if(!next) return null;
  if(!smoothPose){smoothPose=next.map(p=>({...p}));return smoothPose;}
  const t=.35;
  for(let i=0;i<next.length;i++){
    smoothPose[i].x=lerp(smoothPose[i].x,next[i].x,t);
    smoothPose[i].y=lerp(smoothPose[i].y,next[i].y,t);
    smoothPose[i].visibility=next[i].visibility ?? 1;
  }
  return smoothPose;
}
function pt(lm){return{x:(1-lm.x)*window.innerWidth,y:lm.y*window.innerHeight,v:lm.visibility??1}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function ang(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function drawGraphic(center,w,h,rot=0){
  if(mode==='off'||!graphic.complete)return;
  ctx.save();ctx.translate(center.x,center.y);ctx.rotate(rot);
  ctx.drawImage(graphic,-w/2,-h/2,w,h);
  ctx.restore();
}
function drawFilter(landmarks){
  const p=landmarks.map(pt);
  const leftShoulder=p[11], rightShoulder=p[12], leftElbow=p[13], rightElbow=p[14], leftWrist=p[15], rightWrist=p[16], leftHip=p[23], rightHip=p[24];
  if(mode==='forearm'){
    // 오른팔 기준. 반대팔 원하면 leftElbow/leftWrist로 바꾸기.
    const a=rightElbow,b=rightWrist;
    if(a.v<.35||b.v<.35)return;
    const c=mid(a,b), len=dist(a,b);
    drawGraphic(c,len*1.15,len*.46,ang(a,b));
  }
  if(mode==='waist'){
    if(leftHip.v<.35||rightHip.v<.35)return;
    const c=mid(leftHip,rightHip), w=dist(leftHip,rightHip)*1.35;
    drawGraphic({x:c.x,y:c.y-w*.08},w,w*.32,ang(leftHip,rightHip));
  }
  if(mode==='chest'){
    if(leftShoulder.v<.35||rightShoulder.v<.35)return;
    const c=mid(leftShoulder,rightShoulder), w=dist(leftShoulder,rightShoulder)*.95;
    drawGraphic({x:c.x,y:c.y+w*.45},w,w*.36,ang(leftShoulder,rightShoulder));
  }
}
function render(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(lastPose){drawFilter(lastPose);statusEl.textContent='Tracking';}
  else{statusEl.textContent='Stand where your body is visible';}
  requestAnimationFrame(render);
}

async function initCameraFirst(){
  try{
    statusEl.textContent='Checking camera permission...';
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream;
    await video.play();
    statusEl.textContent='Camera on / loading pose model...';
    render();
    initPose();
  }catch(e){
    console.error(e);
    statusEl.textContent='Camera error: '+e.name;
  }
}
function initPose(){
  const pose=new Pose({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
  pose.setOptions({modelComplexity:0,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
  pose.onResults((results)=>{
    if(results.poseLandmarks){lastPose=smoothLandmarks(results.poseLandmarks);} else {lastPose=null;}
  });
  camera=new Camera(video,{onFrame:async()=>{await pose.send({image:video});},width:1280,height:720});
  camera.start();
}
const cameraIntro=document.getElementById('cameraIntro');
initCameraFirst();
video.addEventListener('playing',()=>{
  setTimeout(()=>{
    if(cameraIntro) cameraIntro.classList.add('is-hidden');
  },2000);
},{once:true});
</script>

<script>
(() => {
  if(!window.matchMedia('(pointer:fine)').matches) return;
  const c=document.createElement('div');
  c.className='custom-cursor';
  document.body.appendChild(c);
  window.addEventListener('mousemove',e=>{
    c.style.left=e.clientX+'px'; c.style.top=e.clientY+'px';
    document.body.classList.add('cursor-ready');
  },{passive:true});
  window.addEventListener('mouseout',e=>{ if(!e.relatedTarget) document.body.classList.remove('cursor-ready'); });
})();
</script>

<script src="theme.js"></script>
</body>
</html>
