<!DOCTYPE html>
<html lang="en">
<head>
<script>
(() => {
  const SESSION_KEY = 'sangsoo1ee-session-initialized';
  if (!sessionStorage.getItem(SESSION_KEY)) {
    localStorage.setItem('sangsoo1ee-theme', 'light');
    localStorage.setItem('sangsoo1ee-language', 'en');
    sessionStorage.setItem(SESSION_KEY, '1');
  }
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samsootoo — Info</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:Helvetica,Arial,sans-serif;color:#111;cursor:pointer}
a{color:inherit;text-decoration:none}

.page{
  position:relative;
  width:100%;
  height:100%;
  min-height:560px;
  background:#fff;
  overflow:hidden;
}

.texture-header{
  position:absolute;
  top:0;left:0;right:0;
  height:44px;
  z-index:2;
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center 18%;
  transition:background-image .18s ease, opacity .18s ease;
}
.texture-header::after{
  content:"";
  position:absolute;inset:0;
  background:rgba(255,255,255,.05);
  pointer-events:none;
}


.home-tag{
  position:absolute;
  top:34px;
  left:32px;
  z-index:20;
  display:block;
  width:132px;
  cursor:pointer;
  line-height:0;
}
.home-tag img{display:block;width:132px;height:auto}

.side-nav{
  position:absolute;
  top:100px;
  left:32px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:14px;
  font-family:Helvetica,Arial,sans-serif;
  font-size:26px;
  line-height:1;
  font-weight:300;
  cursor:default;
}
.side-nav a{color:#d2d2d2;transition:color .25s ease}
.side-nav a:hover,.side-nav a.active{color:#111}

.lang{
  position:absolute;
  top:34px;
  right:32px;
  z-index:20;
  font-family:Helvetica,Arial,sans-serif;
  font-size:26px;
  line-height:1;
  font-weight:300;
  color:#d2d2d2;
  cursor:default;
}
.lang .active{color:#111}

.scene{
  position:absolute;
  inset:44px 0 0;
  opacity:0;
  visibility:hidden;
  transform:scale(.995);
  transition:opacity .26s ease, transform .36s cubic-bezier(.22,.8,.22,1), visibility 0s linear .36s;
  pointer-events:none;
}
.scene.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
  transition-delay:0s;
}

.scene img{display:block;user-select:none;-webkit-user-drag:none}

/* SCENE 1 — tattoo */
.scene-tattoo .ghost-graphic{
  position:absolute;
  left:7%;
  right:7%;
  top:14%;
  width:86%;
  height:57%;
  object-fit:contain;
  opacity:.16;
  filter:grayscale(1) contrast(.8);
}
.scene-tattoo .hero-tattoo{
  position:absolute;
  left:50%;
  top:51%;
  width:min(41vw,560px);
  max-height:54vh;
  transform:translate(-50%,-50%);
  object-fit:cover;
}

/* SCENE 2 — dark drawing */
.scene-dark .hero-dark{
  position:absolute;
  left:50%;
  top:49%;
  width:min(74vw,920px);
  max-height:46vh;
  transform:translate(-50%,-50%);
  object-fit:contain;
}

/* SCENE 3 — object study */
.scene-objects .obj-left{
  position:absolute;
  left:10%;
  top:48%;
  width:min(20vw,290px);
  max-height:45vh;
  transform:translateY(-50%);
  object-fit:contain;
}
.scene-objects .obj-center{
  position:absolute;
  left:50%;
  top:51%;
  width:min(7vw,92px);
  max-height:18vh;
  transform:translate(-50%,-50%);
  object-fit:contain;
}
.scene-objects .obj-right{
  position:absolute;
  right:8%;
  top:48%;
  width:min(24vw,325px);
  max-height:48vh;
  transform:translateY(-50%);
  object-fit:contain;
}

.scene-objects .obj-left,
.scene-objects .obj-right{
  z-index:1;
}
.scene-objects .sublogo{
  position:absolute;
  left:50%;
  top:49%;
  width:min(76vw,1180px);
  max-height:58vh;
  transform:translate(-50%,-50%);
  object-fit:contain;
  z-index:2;
  pointer-events:none;
}
.scene-objects .obj-center{
  z-index:3;
}

.contact-left,.contact-right{
  position:absolute;bottom:16px;z-index:15;
  font-family:Arial,Helvetica,"Apple SD Gothic Neo",sans-serif;
  font-size:16px;line-height:1.02;font-weight:400;letter-spacing:-.045em;cursor:default;
}
.contact-left{left:18px}
.contact-right{right:20px;text-align:right}
.contact-left a,.contact-right a{cursor:pointer}
.contact-left a:hover,.contact-right a:hover{text-decoration:underline}
.contact-right .contact-title{display:block;text-transform:uppercase}

.click-hint{
  position:absolute;
  left:50%;
  bottom:14px;
  z-index:10;
  transform:translateX(-50%);
  font-size:10px;
  letter-spacing:.08em;
  color:#d7d7d7;
  opacity:0;
  transition:opacity .25s ease;
  pointer-events:none;
}
.page:hover .click-hint{opacity:1}

@media(max-width:700px){
  .page{min-height:100svh}
  .texture-header{height:42px}
  .home-tag{top:22px;left:18px;width:106px}
  .home-tag img{width:106px}
  .side-nav{top:78px;left:18px;font-size:20px;gap:11px}
  .lang{top:22px;right:18px;font-size:20px}
  .scene{inset:42px 0 0}

  .scene-tattoo .ghost-graphic{left:-24%;width:148%;top:21%;height:39%}
  .scene-tattoo .hero-tattoo{top:48%;width:72vw;max-height:41vh}
  .scene-dark .hero-dark{top:49%;width:88vw;max-height:38vh}

  .scene-objects .obj-left{left:2%;top:39%;width:29vw;max-height:28vh}
  .scene-objects .sublogo{left:50%;top:50%;width:88vw;max-height:43vh}
  .scene-objects .obj-center{left:50%;top:50%;width:15vw;max-height:16vh}
  .scene-objects .obj-right{right:1%;top:60%;width:34vw;max-height:31vh}

  .contact-left,.contact-right{bottom:14px;font-size:11px}
  .contact-left{left:17px}
  .contact-right{right:17px;text-align:right}
  .click-hint{display:none}
}

.lang [data-lang]{cursor:pointer;pointer-events:auto;}

/* Korean glyphs need a slightly stronger weight to visually match Helvetica Light. */
html[lang="ko"] [data-i18n],
html[lang="ko"] .lang {
  font-weight:400;
}

/* =============================================
   APOD-inspired typography pass
   Font sizes intentionally preserved.
   ============================================= */
html, body, button, input, select, textarea {
  font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif;
  font-kerning: normal;
  font-synthesis: none;
  font-feature-settings: "kern" 1, "liga" 1;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body, a, button, span, p, h1, h2, h3, h4, h5, h6 {
  letter-spacing: -0.045em;
}

.side-nav { gap: 2px; font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif; font-weight: 400; line-height: .91; }
.side-nav a { line-height: .91; }
.lang { font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif; font-weight: 400; line-height: .91; }
.contact-left, .contact-right { line-height: 1.02; letter-spacing: -0.035em; }
.click-hint { letter-spacing: .01em; line-height: 1; }
@media(max-width:700px){ .side-nav{gap:2px} }


/* Custom cursor */
@media (pointer:fine){
  html, body, a, button, [role="button"], .interactive, [data-lang], #info, #works, #shop { cursor:none !important; }
  .custom-cursor{
    position:fixed; left:0; top:0; width:42px; height:42px; z-index:99999;
    pointer-events:none; transform:translate(-50%,-50%); opacity:0;
    background:url("cursor2.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 3px rgba(127,127,127,.32));
    transition:opacity .12s ease;
  }
  .custom-cursor::before{
    content:""; position:absolute; left:50%; top:50%; width:78px; height:78px;
    transform:translate(-50%,-50%); border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(127,127,127,.18) 0%, rgba(127,127,127,.10) 34%, rgba(127,127,127,.045) 56%, rgba(127,127,127,0) 74%);
    filter:blur(5px);
  }
  body.cursor-ready .custom-cursor{opacity:1;}
}


/* =========================
   MOBILE ACCESS BLOCK
========================= */
#mobile-block{
  display:none;
}

@media screen and (max-width:767px){
  body > *:not(#mobile-block){
    display:none !important;
  }

  html,
  body{
    margin:0 !important;
    width:100% !important;
    height:100% !important;
    overflow:hidden !important;
    background:#000 !important;
  }

  #mobile-block{
    position:fixed;
    inset:0;
    z-index:2147483647;
    display:flex !important;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    text-align:center;
  }

  .mobile-block-text{
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    font-weight:500;
    line-height:1.15;
    letter-spacing:-0.02em;
    text-transform:uppercase;
  }
}

</style>
<link rel="stylesheet" href="theme.css">
<script>document.documentElement.dataset.theme=localStorage.getItem('sangsoo1ee-theme')==='dark'?'dark':'light';</script>
</head>
<body>

<div id="mobile-block">
  <div class="mobile-block-text">
    DESKTOP ONLY<br>
    PLEASE VIEW ON A DESKTOP DEVICE.
  </div>
</div>

<div class="page" id="page">
  <div class="texture-header" id="textureHeader"></div>

  <a class="home-tag interactive" href="index.html" aria-label="메인으로 이동">
    <img src="nametag.svg" alt="Samsootoo" />
  </a>

  <nav class="side-nav interactive" aria-label="주 메뉴">
    <a class="active" href="info.html" data-i18n="info">INFO</a>
    <a href="works.html" data-i18n="works">WORKS</a>
    <a href="shop.html" data-i18n="shop">SHOP</a>
  </nav>

  <div class="lang interactive"><span data-lang="ko">KR</span>/<span class="active" data-lang="en">EN</span></div>

  <section class="scene scene-tattoo" data-header="info9.webp" aria-hidden="true">
    <img class="ghost-graphic" src="maingraphic.svg" alt="" />
    <img class="hero-tattoo" src="info9.webp" alt="Tattoo artwork" />
  </section>

  <section class="scene scene-dark" data-header="info7.webp" aria-hidden="true">
    <img class="hero-dark" src="info7.webp" alt="Dark thread drawing" />
  </section>

  <section class="scene scene-objects" data-header="info10.webp" aria-hidden="true">
    <img class="obj-left" src="info4.webp" alt="Circular drawing" />
    <img class="sublogo" src="sublogo.webp" alt="" />
    <img class="obj-center" src="info8.webp" alt="Small yin-yang drawing" />
    <img class="obj-right" src="info10.webp" alt="Ceramic object" />
  </section>

  <div class="contact-left interactive">
    <div data-i18n="copyright">© 2026 4900won. All rights reserved.</div>
  </div>
  <div class="contact-right interactive" id="sceneContact"></div>
  <div class="click-hint" data-i18n="clickChange">CLICK TO CHANGE</div>
</div>

<script>
(() => {
  const page = document.getElementById('page');
  const header = document.getElementById('textureHeader');
  const scenes = [...document.querySelectorAll('.scene')];
  const translations = {
    en: {
      info:'INFO', works:'WORKS', shop:'SHOP',
      tattooInquiry:'TATTOO INQUIRY', contact:'CONTACT',
      clickChange:'CLICK TO CHANGE',
      copyright:'© 2026 4900won. All rights reserved.'
    },
    ko: {
      info:'소개', works:'작업', shop:'상점',
      tattooInquiry:'타투 문의', contact:'연락',
      clickChange:'클릭하여 전환',
      copyright:'© 2026 4900won. 모든 권리 보유.'
    }
  };
  const languageButtons = [...document.querySelectorAll('.lang [data-lang]')];

  // Pick the initial scene before language setup so KR/EN can safely refresh it.
  let current = Math.floor(Math.random() * scenes.length);

  function applyLanguage(lang){
    const selected = translations[lang] ? lang : 'en';
    document.documentElement.lang = selected;
    document.querySelectorAll('[data-i18n]').forEach(element => {
      const value = translations[selected][element.dataset.i18n];
      if(value) element.textContent = value;
    });
    languageButtons.forEach(button => button.classList.toggle('active', button.dataset.lang === selected));
    localStorage.setItem('sangsoo1ee-language', selected);
    if(typeof current !== 'undefined') showScene(current);
  }
  languageButtons.forEach(button => button.addEventListener('click', () => applyLanguage(button.dataset.lang)));
  applyLanguage(localStorage.getItem('sangsoo1ee-language') || 'en');


  function showScene(index){
    scenes.forEach((scene, i) => {
      const active = i === index;
      scene.classList.toggle('active', active);
      scene.setAttribute('aria-hidden', String(!active));
    });

    const source = scenes[index].dataset.header;
    header.style.backgroundImage = `url("${source}")`;

    // 각 이미지에서 상단 재질이 잘 보이는 지점을 조금씩 다르게 크롭
    const positions = ['center 18%', 'center 42%', 'center 8%'];
    const sizes = ['cover', 'cover', 'cover'];
    header.style.backgroundPosition = positions[index];
    header.style.backgroundSize = sizes[index];

    const sceneContact = document.getElementById('sceneContact');
    const currentLang = document.documentElement.lang === 'ko' ? 'ko' : 'en';
    const tattooLabel = translations[currentLang].tattooInquiry;
    const contactLabel = translations[currentLang].contact;
    const contactByScene = [
      `<span class="contact-title">${tattooLabel}</span><a href="https://www.instagram.com/sangsoo1ee/" target="_blank" rel="noopener noreferrer">@sangsoo1ee</a>`,
      `<span class="contact-title">${contactLabel}</span><a href="https://www.instagram.com/4900won/" target="_blank" rel="noopener noreferrer">@4900won</a>`,
      `<span class="contact-title">${contactLabel}</span><a href="mailto:dojagigirl@gmail.com">dojagigirl@gmail.com</a>`
    ];
    sceneContact.innerHTML = contactByScene[index];
  }

  function nextScene(){
    current = (current + 1) % scenes.length;
    showScene(current);
  }

  showScene(current);

  page.addEventListener('click', (event) => {
    // 메뉴, 로고, 연락처 링크를 누를 때는 장면 전환을 막음
    if(event.target.closest('.interactive')) return;
    nextScene();
  });

  // 키보드 스페이스/엔터로도 장면 전환
  window.addEventListener('keydown', (event) => {
    if(event.key === ' ' || event.key === 'Enter'){
      if(event.target.matches('a,button,input,textarea,select')) return;
      event.preventDefault();
      nextScene();
    }
  });
})();
</script>

<script>
(() => {
  if(!window.matchMedia('(pointer:fine)').matches) return;
  const c=document.createElement('div');
  c.className='custom-cursor';
  document.body.appendChild(c);
  window.addEventListener('mousemove',e=>{
    c.style.left=e.clientX+'px'; c.style.top=e.clientY+'px';
    document.body.classList.add('cursor-ready');
  },{passive:true});
  window.addEventListener('mouseout',e=>{ if(!e.relatedTarget) document.body.classList.remove('cursor-ready'); });
})();
</script>

<script src="theme.js"></script>
</body>
</html>
