  <style>

:root {
  --pad: 32px;
  --nav-x: 112px;
  --text: #111;
  --muted: #d5d5d5;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: #fff;
  color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 26px;
  line-height: .98;
}
button, a { color: inherit; font: inherit; }
button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
a { text-decoration: none; }
.site-header {
  position: fixed;
  z-index: 20;
  top: 34px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
}
.site-header > * { pointer-events: auto; }
.logo { display:block; width:132px; line-height:0; }
.logo img { display:block; width:132px; height:auto; }
.language { display:flex; gap:1px; font-family:Helvetica,Arial,sans-serif; font-size:26px; font-weight:300; line-height:1; }
.language span:not(.active) { color:#d2d2d2; }
.side-nav {
  position: fixed;
  z-index: 20;
  top: 100px;
  left: 32px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 26px;
  font-weight: 300;
  line-height: 1;
}
.side-nav .muted { color:#d2d2d2; }
.side-nav .active { color:#111; }
.side-nav a:hover { color:#111; }
.works-nav {
  position: fixed;
  z-index: 20;
  top: 140px;
  left: 145px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 240px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 26px;
  font-weight: 300;
  line-height: 1;
}
.year-row { display: flex; flex-direction: column; align-items: flex-start; }
.year-button, .subnav button { display: block; line-height: .98; }
.year-button.dormant { color: #111; }
.works-nav.has-selection .year-button:not(.is-active) { color: var(--muted); }
.works-nav .year-button.is-active { color: #111; }
.subnav { display: none; margin-top: 1px; padding-left: 0; }
.year-row.open .subnav { display: block; }
.subnav button { color: #111; }
.subnav button.is-active { color: #111; }
.works-nav > .year-button, .year-row { margin: 0; }
.works-nav.has-selection .year-row.open { margin-bottom: 18px; }
.gallery-shell {
  padding: 150px 32px 100px 330px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.gallery-shell.is-visible { opacity: 1; pointer-events: auto; }
.gallery-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 44px;
  padding-right: 2px;
}
.gallery-heading h1, .gallery-heading p { margin: 0; font-size: 14px; font-weight: normal; }
.gallery {
  column-count: 3;
  column-gap: clamp(18px, 2.8vw, 48px);
}
.gallery-item {
  display: inline-block;
  width: 100%;
  margin: 0 0 clamp(42px, 7vw, 110px);
  break-inside: avoid;
  vertical-align: top;
}
.gallery-item:nth-child(7n+2) { width: 78%; margin-left: 13%; }
.gallery-item:nth-child(7n+4) { width: 88%; }
.gallery-item:nth-child(7n+6) { width: 67%; margin-left: 28%; }
.gallery-item button { width: 100%; display: block; }
.gallery-item img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 82vh;
  object-fit: contain;
  background: #f6f6f6;
  transition: opacity .2s ease;
}
.gallery-item button:hover img { opacity: .72; }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: rgba(255,255,255,.98);
}
.lightbox.is-open { display: grid; place-items: center; }
.lightbox figure { margin: 0; width: min(88vw, 1500px); height: 88vh; display: grid; place-items: center; }
.lightbox img { max-width: 100%; max-height: 82vh; object-fit: contain; }
.lightbox figcaption { position: absolute; bottom: 17px; left: 50%; transform: translateX(-50%); font-size: 12px; }
.lightbox-close, .lightbox-prev, .lightbox-next { position: absolute; z-index: 2; }
.lightbox-close { top: 14px; right: 20px; font-size: 34px; font-weight: 200; }
.lightbox-prev { left: 18px; top: 50%; transform: translateY(-50%); }
.lightbox-next { right: 18px; top: 50%; transform: translateY(-50%); }
body.lightbox-open { overflow: hidden; }
@media (max-width: 900px) {
  :root { --pad: 18px; --nav-x: 82px; }
  body { font-size: 20px; }
  .site-header{top:22px;left:18px;right:18px}
  .logo,.logo img{width:106px}
  .language{font-size:20px}
  .side-nav{top:78px;left:18px;font-size:20px;gap:11px}
  .works-nav{top:109px;left:112px;font-size:20px}
  .gallery-shell { padding: 250px 14px 70px; }
  .gallery { column-count: 2; column-gap: 14px; }
  .gallery-item { margin-bottom: 48px; }
}
@media (max-width: 560px) {
  .gallery-shell { padding-top: 245px; }
  .gallery { column-count: 1; }
  .gallery-item,
  .gallery-item:nth-child(7n+2),
  .gallery-item:nth-child(7n+4),
  .gallery-item:nth-child(7n+6) { width: 100%; margin-left: 0; }
  .lightbox-prev, .lightbox-next { top: auto; bottom: 16px; transform: none; }
}

/* =============================================
   APOD-inspired typography pass
   Font sizes intentionally preserved.
   ============================================= */
html, body, button, input, select, textarea {
  font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif;
  font-kerning: normal;
  font-synthesis: none;
  font-feature-settings: "kern" 1, "liga" 1;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body, a, button, span, p, h1, h2, h3, h4, h5, h6 {

}

body { font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif; line-height: .91; }
.language { gap: 0; font-family: Arial, Helvetica, "Apple SD Gothic Neo", sans-serif; font-weight: 400; line-height: .91; }

.year-row, .works-nav > .year-button { min-height: 0; }

/* Gallery size lever */
.size-control{
  position:fixed; top:101px; right:32px; z-index:22; width:168px; height:20px;
  display:flex; align-items:center;
}
.size-control input[type="range"]{
  width:100%; height:20px; margin:0; appearance:none; -webkit-appearance:none; background:transparent; outline:none;
}
.size-control input[type="range"]::-webkit-slider-runnable-track{

}

  -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#111; margin-top:-4.5px; border:0;
}
.size-control input[type="range"]::-moz-range-track{height:1px;background:#a9a9a9;border:0;}

/* Custom cursor */
@media (pointer:fine){
  html, body, a, button, [role="button"], .interactive, [data-lang], #info, #works, #shop { cursor:none !important; }
  .custom-cursor{
    position:fixed; left:0; top:0; width:42px; height:42px; z-index:99999;
    pointer-events:none; transform:translate(-50%,-50%); opacity:0;
    background:url("cursor2.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 3px rgba(127,127,127,.32));
    transition:opacity .12s ease;
  }
  .custom-cursor::before{
    content:""; position:absolute; left:50%; top:50%; width:78px; height:78px;
    transform:translate(-50%,-50%); border-radius:50%; z-index:-1;
    background:radial-gradient(circle, rgba(127,127,127,.18) 0%, rgba(127,127,127,.10) 34%, rgba(127,127,127,.045) 56%, rgba(127,127,127,0) 74%);
    filter:blur(5px);
  }
  body.cursor-ready .custom-cursor{opacity:1;}
}


/* =============================================
   DARK MODE — CHAOTIC / OVERLAPPING GALLERY
   White mode remains unchanged.
   ============================================= */
html[data-theme="dark"] .gallery-shell{
  padding:118px 12px 90px 300px !important;
}
html[data-theme="dark"] .gallery{
  column-gap:4px !important;
}
html[data-theme="dark"] .gallery-item,
html[data-theme="dark"] .gallery-item:nth-child(7n+2),
html[data-theme="dark"] .gallery-item:nth-child(7n+4),
html[data-theme="dark"] .gallery-item:nth-child(7n+6){
  width:calc(100% + var(--chaos-grow, 10%));
  margin-left:var(--chaos-x, 0%);
  margin-bottom:var(--chaos-gap, -12px);
  position:relative;
  z-index:var(--chaos-z, 1);
  transform:translate(var(--chaos-tx, 0px), var(--chaos-ty, 0px)) rotate(var(--chaos-r, 0deg));
  transform-origin:center center;
  transition:transform .18s ease, z-index 0s;
}
html[data-theme="dark"] .gallery-item button{
  overflow:visible;
}
html[data-theme="dark"] .gallery-item img{
  max-height:none;
  background:transparent;
}
html[data-theme="dark"] .gallery-item:hover{
  z-index:60 !important;
  transform:translate(var(--chaos-tx, 0px), var(--chaos-ty, 0px)) rotate(0deg) scale(1.035);
}
@media(max-width:900px){
  html[data-theme="dark"] .gallery-shell{padding:230px 8px 60px !important;}
  html[data-theme="dark"] .gallery{column-gap:2px !important;}
}
@media(max-width:560px){
  html[data-theme="dark"] .gallery-item,
  html[data-theme="dark"] .gallery-item:nth-child(7n+2),
  html[data-theme="dark"] .gallery-item:nth-child(7n+4),
  html[data-theme="dark"] .gallery-item:nth-child(7n+6){
    width:100%;
    margin-left:0;
    margin-bottom:8px;
    transform:none;
  }
}

const gallerySize = document.getElementById('gallerySize');
function applyGallerySize(value){
  // left = more/smaller images, right = fewer/larger images
  const v = Number(value);
  const columns = Math.max(2, Math.min(8, Math.round(8 - (v / 100) * 6)));
  document.documentElement.style.setProperty('--gallery-columns', columns);
  localStorage.setItem('sangsoo1ee-gallery-size', String(v));
}

  const saved = localStorage.getItem('sangsoo1ee-gallery-size');
  if(saved !== null) gallerySize.value = saved;

}

  if(activeCollection) renderCollection(activeCollection, ['sofar','inhouse','yinyang','color','practice','vehicle'].includes(activeCollection) ? '2026' : activeCollection);
}

  worksNav.classList.add('has-selection');

function openYear2026() {
  yearRow.classList.add('open');
  setActiveYear('2026');
}

function closeYear2026() {
  yearRow.classList.remove('open');
  subButtons.forEach(button => button.classList.remove('is-active'));
}

function seededChaos(index, key){
  // Deterministic pseudo-random values: chaotic, but stable on every render.
  let seed = 0;
  const str = `${key}-${index}`;
  for(let i=0;i<str.length;i++) seed = (seed * 31 + str.charCodeAt(i)) >>> 0;
  const rand = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  return {
    r: (-8 + rand() * 16).toFixed(2) + 'deg',
    tx: (-20 + rand() * 40).toFixed(1) + 'px',
    ty: (-12 + rand() * 24).toFixed(1) + 'px',
    x: (-8 + rand() * 13).toFixed(1) + '%',
    grow: (6 + rand() * 22).toFixed(1) + '%',
    gap: (-34 + rand() * 30).toFixed(1) + 'px',
    z: String(1 + Math.floor(rand() * 18))
  };
}

function renderCollection(key, year = key) {
  activeCollection = key;
  const images = collections[key];

  if (year === '2026') {
    openYear2026();
    subButtons.forEach(button => button.classList.toggle('is-active', button.dataset.collection === key));
  } else {
    closeYear2026();
    setActiveYear(year);
  }

  title.textContent = labels[key];
  gallery.innerHTML = '';

  images.forEach((src, index) => {
    const item = document.createElement('article');
    item.className = 'gallery-item';
    const chaos = seededChaos(index, key);
    item.style.setProperty('--chaos-r', chaos.r);
    item.style.setProperty('--chaos-tx', chaos.tx);
    item.style.setProperty('--chaos-ty', chaos.ty);
    item.style.setProperty('--chaos-x', chaos.x);
    item.style.setProperty('--chaos-grow', chaos.grow);
    item.style.setProperty('--chaos-gap', chaos.gap);
    item.style.setProperty('--chaos-z', chaos.z);
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('aria-label', `${interfaceTranslations[currentLanguage].open} ${index + 1} / ${images.length}`);
    const img = document.createElement('img');
    img.src = src;
    img.alt = `${labels[key]} ${index + 1}`;
    img.loading = index < 6 ? 'eager' : 'lazy';
    img.decoding = 'async';
    button.appendChild(img);
    button.addEventListener('click', () => openLightbox(index));
    item.appendChild(button);
    gallery.appendChild(item);
  });

  galleryShell.classList.add('is-visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

year2026.addEventListener('click', () => {
  openYear2026();
  galleryShell.classList.remove('is-visible');
  subButtons.forEach(button => button.classList.remove('is-active'));
});

subButtons.forEach(button =>
  button.addEventListener('click', () => renderCollection(button.dataset.collection, '2026'))
);

directButtons.forEach(button =>

function showLightboxImage() {
  const images = collections[activeCollection];
  lightboxImage.src = images[activeIndex];
  lightboxImage.alt = `${labels[activeCollection]} ${activeIndex + 1}`;
  const currentSrc = images[activeIndex];
  const captions = imageCaptionsByLanguage[currentLanguage] || imageCaptionsByLanguage.en;
  lightboxCaption.textContent = captions[currentSrc] || `${labels[activeCollection]} — ${activeIndex + 1} / ${images.length}`;
}

function openLightbox(index) {
  activeIndex = index;
  showLightboxImage();
  lightbox.classList.add('is-open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lightbox-open');
  document.getElementById('lightboxClose').focus();
}

function closeLightbox() {
  lightbox.classList.remove('is-open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lightbox-open');
}

function moveLightbox(direction) {
  const total = collections[activeCollection].length;
  activeIndex = (activeIndex + direction + total) % total;
  showLightboxImage();
}

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => moveLightbox(-1));
document.getElementById('lightboxNext').addEventListener('click', () => moveLightbox(1));
lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', event => {
  if (!lightbox.classList.contains('is-open')) return;
  if (event.key === 'Escape') closeLightbox();
  if (event.key === 'ArrowLeft') moveLightbox(-1);
  if (event.key === 'ArrowRight') moveLightbox(1);
});
  </script>

<script>
(() => {
  if(!window.matchMedia('(pointer:fine)').matches) return;
  const c=document.createElement('div');
  c.className='custom-cursor';
  document.body.appendChild(c);
  window.addEventListener('mousemove',e=>{
    c.style.left=e.clientX+'px'; c.style.top=e.clientY+'px';
    document.body.classList.add('cursor-ready');
  },{passive:true});
  window.addEventListener('mouseout',e=>{ if(!e.relatedTarget) document.body.classList.remove('cursor-ready'); });
})();
</script>

<script src="theme.js"></script>
