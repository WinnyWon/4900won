<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP</title>

  <style>

/* =========================
   MOBILE ACCESS BLOCK
========================= */
#mobile-block{
  display:none;
}

@media screen and (max-width:767px){
  body > *:not(#mobile-block){
    display:none !important;
  }

  html,
  body{
    margin:0 !important;
    width:100% !important;
    height:100% !important;
    overflow:hidden !important;
    background:#000 !important;
  }

  #mobile-block{
    position:fixed;
    inset:0;
    z-index:2147483647;
    display:flex !important;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    text-align:center;
  }

  .mobile-block-text{
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    font-weight:500;
    line-height:1.15;
    letter-spacing:-0.02em;
    text-transform:uppercase;
  }
}

</style>
<script>
  const isMobileViewport = window.matchMedia("(max-width: 767px)").matches;
  if (!isMobileViewport) {
    window.location.href = "https://sangsoo1ee.com";
  }
</script>
</head>

<body>

<div id="mobile-block">
  <div class="mobile-block-text">
    DESKTOP ONLY<br>
    PLEASE VIEW ON A DESKTOP DEVICE.
  </div>
</div>

</body>
</html>
